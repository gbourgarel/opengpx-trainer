# Pushing a tag v* builds the wheel (UI included) and attaches it to a GitHub release.
# A friend then installs it with: uv tool install <URL of the .whl>
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build the wheel
        working-directory: backend
        run: uv build --wheel -o ../wheel
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wheel/*.whl --title "$GITHUB_REF_NAME" --generate-notes
