[project]
name = "opengpx-trainer"
version = "1.0.0"
description = "Ride any GPX route or ERG workout on a home trainer (ANT+ / BLE), with a 3D view"
license = "MIT"  # the LICENSE file sits at the repository root: hatch_build.py ships it
authors = [
    { name = "Guillaume Bourgarel", email = "guillaume.bourgarel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "fastapi>=0.162.0",
    "fit-tool>=0.9.17",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "libusb-package>=1.0.30.1",
    "numpy>=2.5.4",
    "openant>=1.3.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
opengpx-trainer = "opengpx_trainer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# puts frontend/dist in the wheel (hatch_build.py)
[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI File()/Depends() defaults
